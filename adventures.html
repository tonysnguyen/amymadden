  .trip-body { padding: 16px 12px 10px; gap: 10px; }
  .trip-title { font-size: 22px; }
  .trip-copy { font-size: 15px; }
  .trip-cta { min-height: 44px; }
  .more { margin-top: 56px; }
  .more-row { gap: 12px; }
  .rt { padding: 8px 16px 8px 8px; gap: 14px; border-radius: var(--radius-lg); }
  .rt-media { width: 96px; height: 76px; border-radius: var(--radius-md); }
  .rt-title { font-size: 20px; }
  .rt-go { width: 44px; height: 44px; }
}
.sh-nav a { position: relative; padding: 8px 0; font: 400 14px/1.2 var(--font-body); color: rgba(var(--navy-rgb), .78); text-decoration: none; transition: color .2s ease; }
.sh-nav a[aria-current] { font-weight: 500; color: var(--navy); }
.sh-links a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-bottom: 1px solid rgba(var(--navy-rgb), .08); font-family: var(--font-display); font-stretch: 100%; font-weight: 700; font-size: 28px; letter-spacing: -0.02em; color: var(--navy); text-decoration: none; }
.sh-scrim { position: fixed; inset: 0; z-index: 35; display: block; width: 100%; padding: 0; border: 0; margin: 0; background: rgba(var(--navy-deep-rgb), .28); opacity: 0; pointer-events: none; cursor: default; transition: opacity .3s ease; }
.sh-scrim.is-open { opacity: 1; pointer-events: auto; }
@media (hover: hover) {
  .sh-nav a:hover { color: var(--navy); }
  .sh-ic:hover { background: rgba(var(--navy-rgb), .07); }
  .sh-cta:hover { background: var(--blue-hover); }
  .sh-cta[aria-current]:hover { background: var(--navy-deep); }
  .sh-menu:hover { background: rgba(var(--navy-rgb), .07); }
  .sh-links a:hover svg { color: var(--navy); }
  .sh-soc:hover { background: rgba(var(--navy-rgb), .05); }
}
@media (min-width: 900px) { .sh-sheet, .sh-scrim { display: none; } }
@media (max-width: 560px) { .sh-links a { font-size: 26px; min-height: 54px; } }
@media (prefers-reduced-motion: reduce) { .sh-sheet, .sh-bar, .sh-scrim { transition: none; } }
.sf-grid a { display: block; padding: 6px 0; font: 400 14px/1.5 var(--font-body); color: var(--line); text-decoration: none; transition: color .2s ease; }
@media (hover: hover) { .sf-grid a:hover, .sf-up:hover { color: var(--chalk); } }
@media (max-width: 560px) {
  .sf { padding: 56px 0 24px; }

  .sf-grid a { padding: 9px 0; }
  .sf-bot { margin-top: 32px; }
}
.nx { padding: clamp(88px, 9vw, 128px) 0; }
.nx-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 32px; padding: 20px 20px 20px clamp(24px, 4vw, 56px); border-radius: var(--radius-xl); background: var(--white); color: var(--navy); text-decoration: none; box-shadow: var(--shadow-card); transition: transform .42s var(--ease-out), box-shadow .42s var(--ease-out); }
.nx-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.nx-eb { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-stretch: 75%; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--slate); }
.nx-eb::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--chalk); }
.nx-title { display: inline-flex; align-items: center; gap: 18px; font-family: var(--font-display); font-stretch: 100%; font-weight: 700; font-size: clamp(36px, 4.6vw, 56px); line-height: 1.02; letter-spacing: -0.03em; }
.nx-arrow { flex: none; width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--blue); color: var(--white); transition: translate .35s var(--ease-out); }
.nx-text { font: 300 16px/1.6 var(--font-body); color: var(--slate); max-width: 440px; }
.nx-frame { display: block; overflow: hidden; border-radius: 20px; height: 280px; }
.nx-frame img { width: 100%; height: 100%; max-width: none; object-fit: cover; transition: scale .5s var(--ease-out); }
.nx-dark { grid-template-columns: minmax(0, 1fr); background: var(--navy); color: var(--white); padding: clamp(32px, 5vw, 64px); box-shadow: none; }
.nx-dark .nx-eb { color: var(--line); }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .nx-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .nx-card:hover .nx-arrow { translate: 4px 0; }
  .nx-card:hover .nx-frame img { scale: 1.04; }
}
@media (max-width: 760px) {
  .nx { padding: 64px 0 80px; }
  .nx-card { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px; border-radius: var(--radius-lg); }
  .nx-copy { padding: 14px 10px 10px; gap: 12px; }
  .nx-frame { order: -1; height: 200px; border-radius: 16px; }
  .nx-arrow { width: 44px; height: 44px; }
  .nx-dark { padding: 28px 22px; }
}
.viewer:focus { outline: none; }
.viewer:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
.pre { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .viewer.is-closing { animation: vwOut .19s var(--ease-in) both; }
  @keyframes vwOut { to { opacity: 0; translate: 0 10px; } }
  .ph-n0 { animation: phN0 .38s var(--ease-out) both; } .ph-n1 { animation: phN1 .38s var(--ease-out) both; }
  .ph-p0 { animation: phP0 .38s var(--ease-out) both; } .ph-p1 { animation: phP1 .38s var(--ease-out) both; }
  .ph-j0 { animation: phJ0 .32s var(--ease-out) both; } .ph-j1 { animation: phJ1 .32s var(--ease-out) both; }
  @keyframes phN0 { from { opacity: 0; translate: 32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phN1 { from { opacity: 0; translate: 32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phP0 { from { opacity: 0; translate: -32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phP1 { from { opacity: 0; translate: -32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phJ0 { from { opacity: 0; scale: .97; } to { opacity: 1; scale: 1; } }
  @keyframes phJ1 { from { opacity: 0; scale: .97; } to { opacity: 1; scale: 1; } }
  .wall-grid.ga0 .tile { animation: gA .42s var(--ease-out) backwards; }
  .wall-grid.ga1 .tile { animation: gB .42s var(--ease-out) backwards; }
  @keyframes gA { from { opacity: 0; translate: 0 12px; } }
  @keyframes gB { from { opacity: 0; translate: 0 12px; } }
}
sc-if, sc-for { display: contents; }
</style>

<noscript><p style="font-family:sans-serif;padding:24px;max-width:640px">This site needs JavaScript turned on to show Amy’s chalk art and photos.</p></noscript>

  </header>
  <button class="sh-scrim {{sh.cls}}" type="button" tabindex="-1" aria-label="Close menu" onClick="{{sh.close}}"></button>
<main class="pg-in">
  <section class="a-hero">
    <div class="wrap">
      <figure class="hero reveal">
        <img src="assets/img/adventures/banner.webp" alt="Adventures banner photo">
        <span class="hero-scrim" aria-hidden="true"></span>
        <figcaption class="hero-cap">
          <h1 class="eyebrow">Adventures</h1>
          <blockquote class="headline hero-q">“Traveling – it leaves you speechless, then turns you into a <span class="nw"><span class="sq">storyteller<svg class="sq-line" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 10 C 22 3, 38 14, 58 8 S 92 3, 112 9 S 146 14, 166 7 S 190 5, 197 9" fill="none" stroke="#F6C453" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span>.”</span></blockquote>
          <p class="hero-by">— Ibn Battuta</p>
        </figcaption>
      </figure>
    </div>
  </section>
  <section class="a-trips" aria-labelledby="trips-label">
    <div class="wrap">
      <div class="sec-head reveal"><h2 class="eyebrow" id="trips-label">Trips</h2><p class="hint">Choose a trip to open its photos.</p></div>
      <ol class="tl" aria-label="Timeline"><li class="tl-stop c-yellow {{tl.v17.cls}}"><span class="tl-dot" aria-hidden="true"></span><p class="tl-year">2017</p></li><li class="tl-stop c-pink {{tl.v19.cls}}"><span class="tl-dot" aria-hidden="true"></span><p class="tl-year">2019</p></li><li class="tl-stop c-mint {{tl.caw.cls}}"><span class="tl-dot" aria-hidden="true"></span><p class="tl-year">2021</p></li></ol>
      <div class="trips">
        <button class="trip tile c-yellow {{t.v17.cls}}" data-card="vietnam-2017" style="order:1;" type="button" aria-expanded="{{t.v17.exp}}" onClick="{{t.v17.open}}">
          <span class="trip-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/adventures/vietnam-2017/cover.webp" alt="Vietnam, 2017" style="object-position:center"></span>
          <span class="trip-body">
            <span class="chip">2017</span>
            <span class="trip-title">Vietnam Trip #1</span>
            <span class="trip-copy">First trip to Vietnam in 2017 with my husband (boyfriend at the time). I hadn’t traveled to any Asian countries yet and it was great to explore the beauty of the Vietnam culture.</span>
            
            <span class="trip-foot"><span class="trip-cta">{{t.v17.cta}}</span><span class="trip-n">{{t.v17.count}}</span></span>
          </span>
        </button>
        <button class="trip tile c-pink {{t.v19.cls}}" data-card="vietnam-2019" style="order:3;" type="button" aria-expanded="{{t.v19.exp}}" onClick="{{t.v19.open}}">
          <span class="trip-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/adventures/vietnam-2019/cover.webp" alt="Vietnam, 2019" style="object-position:center"></span>
          <span class="trip-body">
            <span class="chip">2019</span>
            <span class="trip-title">Vietnam Trip #2</span>
            <span class="trip-copy">Second trip to Vietnam. My husband (boyfriend at the time) and I brought along our friend James with us. Little did I know James was part of the big plan organized by Tony. My surprise engagement took place! I had no idea it was coming!</span>
            <span class="trip-extra"><span class="ast" aria-hidden="true">✳︎</span>Memorable moments: engagement on the hand bridge in Da Nang, reconnecting with Tony’s family in Vietnam and a gifted jade bracelet from Tony’s aunt.</span>
            <span class="trip-foot"><span class="trip-cta">{{t.v19.cta}}</span><span class="trip-n">{{t.v19.count}}</span></span>
          </span>
        </button>
        <button class="trip tile c-mint {{t.caw.cls}}" data-card="california-washington" style="order:5;" type="button" aria-expanded="{{t.caw.exp}}" onClick="{{t.caw.open}}">
          <span class="trip-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/adventures/ca-to-wa/cover.webp" alt="On the road from California to Washington" style="object-position:center 40%"></span>
          <span class="trip-body">
            <span class="chip">June 2021</span>
            <span class="trip-title">CA. to WA.</span>
            <span class="trip-copy">Roadtrips are a great way to explore. See our travels from CA to WA.</span>
            
            <span class="trip-foot"><span class="trip-cta">{{t.caw.cta}}</span><span class="trip-n">{{t.caw.count}}</span></span>
          </span>
        </button>
      <sc-if value="{{tripOpen}}" hint-placeholder-val="{{ true }}">

      </div>
      <div class="v-foot"><span>{{v.showing}}<span class="swipe-hint"> · Swipe to browse</span></span><a href="{{v.src}}" target="_blank" rel="noopener">Full resolution ↗</a></div>
    </div>
    <div class="v-det"><sc-if value="{{isV17}}" hint-placeholder-val="{{ false }}">
        <h4 class="v-det-h">Vietnam for the first time!</h4>
        <p class="v-det-spec">Visited: Sapa, Hanoi, Ha Long Bay and Saigon.</p>
        <p>Traveling to Vietnam was an adventure I will never forget. Flying internationally as an adult for the first time was a little nerve-wracking. The countryside in Sapa (North Vietnam) was my favorite over being in the city. How folks travel around on mopeds, the stunning rice fields, green mountain ranges and colder temps in December just leave you breathless. With that said, the city did have Avengers Tower and in Ha Long Bay try to find King Kong. Tony’s family in Vietnam were so welcoming and can’t wait to visit them in the future.</p>
      </sc-if>
      <sc-if value="{{isV19}}" hint-placeholder-val="{{ true }}">
        <h4 class="v-det-h">Vietnam V2!</h4>
        <p>Right after my first visit to Vietnam a hand bridge was built connecting the north and the south near the DMZ line. To my complete surprise Vietnam trip #2 would include an engagement ring (I said “yes” btw), good times reconnecting with family, a bruised hand by a jade bracelet, meeting with friends who were traveling in Vietnam and such awesome memories. Can’t wait to go back again.</p>
      </sc-if>
      <sc-if value="{{isCaw}}" hint-placeholder-val="{{ false }}">
        <h4 class="v-det-h">Honeymoon: SoCal to WA</h4>
        <p>Traveling doesn’t always have to be lavish or expensive. We took a driving trip up the West Coast of the US exploring various hiking trails, coastal towns and outdoor activities. Honestly, this is when I really fell in love with the PNW. Now in 2023, I’m officially living in WA spending my time exploring and being open to new adventures. We had stops along the way in CA (San Jose, Redding), OR (Ashland, Thor’s Well in Yachats, Depoe Bay), WA (Gig Harbor, Tacoma, Tumwater Falls). Major loved the Oregon Coast exploring our very own beach. He was the happiest dog.</p>

        <img class="v-img {{anim}}" src="{{v.src}}" alt="{{v.alt}}"><img class="pre" src="{{nextSrc}}" alt="" aria-hidden="true"><img class="pre" src="{{prevSrc}}" alt="" aria-hidden="true">
        <sc-if value="{{v.hasMany}}" hint-placeholder-val="{{ true }}">
          <button class="v-nav v-prev" type="button" aria-label="Previous photo" onClick="{{prev}}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
