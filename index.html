    return v;
  }
  _pageVals() {
    const navOpen = !!(this.state && this.state.navOpen);
    return {
      navOpen: navOpen,
      navClosed: !navOpen,
      navOpenStr: navOpen ? 'true' : 'false',
      menuLabel: navOpen ? 'Close menu' : 'Open menu',
      toggleNav: () => this.setState({ navOpen: !navOpen })
    };
  }
}
