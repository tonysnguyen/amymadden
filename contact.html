.sf .sh-logo { color: #FFFFFF; font-size: 22px; }
.sf-line { margin: 0; font: 300 15px/1.5 'Poppins', sans-serif; color: #C4D0DA; }
.sf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 48px; }
.sf-h { margin: 0 0 10px; font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #FFFFFF; }
.sf-grid a { display: block; padding: 6px 0; font: 400 14px/1.5 'Poppins', sans-serif; color: #C4D0DA; text-decoration: none; transition: color .2s ease; }
.sf-bot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; margin-top: 48px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); font: 400 13px/1.5 'Poppins', sans-serif; }
.sf-chalk { color: #F6C453; }
.sf-up { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; font-weight: 500; text-decoration: none; }
@media (hover: hover) { .sf-grid a:hover, .sf-up:hover { color: #F6C453; } }
@media (max-width: 760px) { .sf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .sf { padding: 56px 0 24px; }
  .sf-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 32px; }
  .sf-grid a { padding: 9px 0; }
  .sf-bot { margin-top: 32px; }
}

/* ===== page transitions ===== */
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .pg-in { animation: pgIn .55s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes pgIn { from { opacity: 0; translate: 0 10px; } }
  ::view-transition-old(root) { animation: vtOut .2s ease both; }
  ::view-transition-new(root) { animation: vtIn .36s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes vtOut { to { opacity: 0; } }
  @keyframes vtIn { from { opacity: 0; translate: 0 8px; } }
}
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
@media (hover: none) and (prefers-reduced-motion: no-preference) { .nx-card:active, .sh-cta:active, .sh-soc:active { transform: scale(.98); transition: transform .12s ease; } }
</style>
<style>sc-if, sc-for { display: contents; } #dc-root:empty { min-height: 100vh; background: #F8FAFB; }</style>
</head>
<body>
<div id="dc-root"></div>
<noscript><p style="font-family:sans-serif;padding:24px;max-width:640px">This site needs JavaScript turned on to show Amy’s chalk art and photos.</p></noscript>
<template id="dc-template"><div class="pg" style="min-height:100vh; background:#F8FAFB; font-family:'Poppins',sans-serif; color:#173350; display:flex; flex-direction:column;">

  <header class="sh-hdr" id="top" onKeyDown="{{sh.key}}">
    <div class="sh-in">
      <a class="sh-logo" href="index.html">Madden's Adventures<span class="sh-dot" aria-hidden="true"></span></a>
      <nav class="sh-nav" aria-label="Main"><a href="about.html">About</a><a href="chalk-art.html">Chalk Art</a><a href="moments.html">Moments</a><a href="adventures.html">Adventures</a></nav>
      <div class="sh-r">
        <a class="sh-ic" href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5v.01"></path></svg></a>
        <a class="sh-cta" href="contact.html" aria-current="page">Say hello</a>
        <button class="sh-menu" type="button" aria-label="{{sh.label}}" aria-expanded="{{sh.exp}}" aria-controls="sh-sheet" onClick="{{sh.toggle}}"><span class="sh-bar b1" aria-hidden="true"></span><span class="sh-bar b2" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="sh-sheet {{sh.cls}}" id="sh-sheet">
      <div class="sh-sheet-in"><div class="sh-pad">
        <nav class="sh-links" aria-label="Menu"><a href="index.html"><span>Home</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="about.html"><span>About</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="chalk-art.html"><span>Chalk Art</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="moments.html"><span>Moments</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="adventures.html"><span>Adventures</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a></nav>
        <div class="sh-row">
          <a class="sh-cta sh-cta-lg" href="contact.html" aria-current="page">Say hello</a>
          <a class="sh-soc" href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5v.01"></path></svg>Instagram</a>
          <a class="sh-soc" href="https://www.linkedin.com/in/amy-madden-b2183a4/" target="_blank" rel="noopener"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10.5V17M8 7.5v.01M12 17v-6.5M12 13.5a2.5 2.5 0 0 1 5 0V17"></path></svg>LinkedIn</a>
        </div>
      </div></div>
    </div>
  </header>
  <button class="sh-scrim {{sh.cls}}" type="button" tabindex="-1" aria-label="Close menu" onClick="{{sh.close}}"></button>

  <main class="ct-main pg-in" style="flex:1; padding:120px 0 144px;">
    <div class="wrap">
      <div style="text-align:center; max-width:980px; margin:0 auto;">
        <p class="eyebrow" style="--dot:#F39BB0;">Contact</p>
        <h1 class="display" style="margin-top:20px;">Get in <span class="sq">touch<svg aria-hidden="true" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M4 7 C 40 2, 80 11, 120 6 S 180 3, 196 6" fill="none" stroke="#F39BB0" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span>.</h1>
        <p style="margin-top:32px; font-family:'Poppins',sans-serif; font-weight:300; font-size:18px; line-height:1.65; color:#3F5873;">Say hello on Instagram or send a note below.</p>
      </div>

      <div class="card" style="margin-top:64px;">
        <div class="{{liveClass}}" role="status" aria-live="polite">
          <sc-if value="{{hasErrors}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>
          </sc-if>
          <span>{{liveText}}</span>
        </div>

        <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
          <form aria-label="Contact form" onSubmit="{{onSubmit}}">
            <div class="fgrid">
              <div class="row2">
                <div>
                  <div class="{{cls.first}}">
                    <input id="ct-first" name="first" type="text" autocomplete="given-name" aria-required="true" aria-invalid="{{inv.first}}" aria-describedby="{{desc.first}}" value="{{first}}" onChange="{{setFirst}}" disabled="{{sending}}">
                    <label for="ct-first">First name</label>
                  </div>
                  <sc-if value="{{err.first}}" hint-placeholder-val="{{ false }}">
                    <p class="ferr" id="ct-first-err"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>{{err.first}}</p>
                  </sc-if>
                </div>
                <div>
                  <div class="{{cls.last}}">
                    <input id="ct-last" name="last" type="text" autocomplete="family-name" value="{{last}}" onChange="{{setLast}}" disabled="{{sending}}">
                    <label for="ct-last">Last name <span class="opt">(optional)</span></label>
                  </div>
                </div>
              </div>
              <div>
                <div class="{{cls.email}}">
                  <input id="ct-email" name="email" type="email" autocomplete="email" aria-required="true" aria-invalid="{{inv.email}}" aria-describedby="{{desc.email}}" value="{{email}}" onChange="{{setEmail}}" disabled="{{sending}}">
                  <label for="ct-email">Email</label>
                </div>
                <sc-if value="{{err.email}}" hint-placeholder-val="{{ false }}">
                  <p class="ferr" id="ct-email-err"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>{{err.email}}</p>
                </sc-if>
              </div>
              <div>
                <div class="{{cls.subject}}">
                  <input id="ct-subject" name="subject" type="text" value="{{subject}}" onChange="{{setSubject}}" disabled="{{sending}}">
                  <label for="ct-subject">Subject <span class="opt">(optional)</span></label>
                </div>
              </div>
              <div>
                <div class="{{cls.message}}">
                  <textarea id="ct-message" name="message" rows="6" aria-required="true" aria-invalid="{{inv.message}}" aria-describedby="{{desc.message}}" value="{{message}}" onChange="{{setMessage}}" disabled="{{sending}}"></textarea>
                  <label for="ct-message">Message</label>
                </div>
                <sc-if value="{{err.message}}" hint-placeholder-val="{{ false }}">
                  <p class="ferr" id="ct-message-err"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>{{err.message}}</p>
                </sc-if>
              </div>
              <button type="button" class="send" onClick="{{send}}" disabled="{{sending}}" aria-busy="{{sendingStr}}">
                <sc-if value="{{sending}}" hint-placeholder-val="{{ false }}">
                  <span class="spin" aria-hidden="true"></span>
                  <span>Sending…</span>
                </sc-if>
                <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
                  <span>Send message</span>
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                </sc-if>
              </button>
            </div>
          </form>
        </sc-if>

        <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
          <div class="done open-anim">
            <div class="done-badge" aria-hidden="true">
              <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path class="done-check" d="M15 29.5 C 18.5 32, 21.5 35.5, 24 39 C 29 30, 34.5 22.5, 42 16" stroke="#7FD1B9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <svg width="96" height="96" viewBox="0 0 96 96" fill="none" style="position:absolute; inset:0;"><circle cx="84" cy="18" r="4" fill="#F6C453"></circle><circle cx="12" cy="76" r="3" fill="#F39BB0"></circle><circle cx="90" cy="64" r="2.5" fill="#7FD1B9"></circle></svg>
            </div>
            <h2 class="done-h" id="ct-done" tabindex="-1">Thanks! Your message is on its way.</h2>
            <button type="button" class="txt-btn" onClick="{{reset}}">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>
              Send another
            </button>
          </div>
        </sc-if>
      </div>

      <section class="reveal" aria-labelledby="ct-else" style="max-width:680px; margin:64px auto 0;">
        <h2 id="ct-else" class="eyebrow" style="--dot:#7FD1B9;">Elsewhere</h2>
        <div class="tiles" style="margin-top:18px;">
          <a class="tile" href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener">
            <span class="tile-ic"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5h.01"></path></svg></span>
            <span><span class="tile-t">Instagram</span><span class="tile-s">@majorsquest</span></span>
            <svg class="tile-go" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          </a>
          <a class="tile" href="https://www.linkedin.com/in/amy-madden-b2183a4/" target="_blank" rel="noopener">
            <span class="tile-ic"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg></span>
            <span><span class="tile-t">LinkedIn</span><span class="tile-s">Amy Madden</span></span>
            <svg class="tile-go" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="sf">
    <div class="sf-in">
      <div class="sf-top">
        <a class="sh-logo" href="index.html">Madden's Adventures<span class="sh-dot" aria-hidden="true"></span></a>
        <p class="sf-line">Little moments, big adventures.</p>
      </div>
      <div class="sf-grid">
        <div><p class="sf-h">Explore</p><a href="index.html">Home</a><a href="about.html">About</a><a href="chalk-art.html">Chalk Art</a><a href="moments.html">Moments</a><a href="adventures.html">Adventures</a></div>
        <div><p class="sf-h">Galleries</p><a href="chalk-art.html">Chalk Art Festivals</a><a href="moments.html">Major</a><a href="moments.html">Gear Head</a><a href="adventures.html">Vietnam</a></div>
        <div><p class="sf-h">Say hello</p><a href="contact.html">Contact</a><a href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener">Instagram @majorsquest</a><a href="https://www.linkedin.com/in/amy-madden-b2183a4/" target="_blank" rel="noopener">LinkedIn</a></div>
      </div>
      <div class="sf-bot"><span>© 2026 Amy Madden</span><span class="sf-chalk">Less talk, more chalk.</span><a class="sf-up" href="#top">Back to top ↑</a></div>
    </div>
  </footer>
</div>
</template>
<script src="assets/js/dc-lite.js"></script>
<script src="assets/js/site-config.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const v = this._pageVals();
    const open = !!(this.state && this.state.shOpen);
    v.sh = {
      cls: open ? 'is-open' : '',
      exp: open ? 'true' : 'false',
      label: open ? 'Close menu' : 'Open menu',
      toggle: () => this.setState({ shOpen: !open }),
      close: () => this.setState({ shOpen: false }),
      key: (e) => { if (e && e.key === 'Escape' && open) this.setState({ shOpen: false }); }
    };
    return v;
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  _pageVals() {
    const P = 'ct-';
    const s = this.state || {};
    const v = { first: s.first || '', last: s.last || '', email: s.email || '', subject: s.subject || '', message: s.message || '' };
    const phase = s.phase || 'form';
    const tried = !!s.tried;
    const failed = !!s.failed && phase === 'form';
    const navOpen = !!s.navOpen;
    const em = v.email.trim();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
    const errs = {
      first: v.first.trim() ? '' : 'Please enter your first name.',
      email: !em ? 'Please enter your email.' : (emailOk ? '' : 'That email doesn’t look quite right. Try name@example.com.'),
      message: v.message.trim() ? '' : 'Please write a short message.'
    };
    const shown = tried && phase === 'form' ? errs : { first: '', email: '', message: '' };
    const names = { first: 'First name', email: 'Email', message: 'Message' };
    const bad = ['first', 'email', 'message'].filter(k => shown[k]);
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const cls = {};
    ['first', 'last', 'email', 'subject', 'message'].forEach(k => {
      cls[k] = 'fld' + (k === 'message' ? ' is-ta' : '') + (v[k] ? ' is-filled' : '') + (shown[k] ? ' is-err' : '');
    });
    const focusEl = (id) => setTimeout(() => {
      try { const el = document.getElementById(id); if (el) el.focus({ preventScroll: false }); } catch (e) {}
    }, 30);
    const send = () => {
      if ((this.state || {}).phase === 'sending') return;
      const firstBad = ['first', 'email', 'message'].find(k => errs[k]);
      if (firstBad) { this.setState({ tried: true }); focusEl(P + firstBad); return; }
      this.setState({ phase: 'sending', tried: true, failed: false });
      const endpoint = (window.SITE_CONFIG && window.SITE_CONFIG.formEndpoint) || '';
      if (!endpoint) {
        // No form service configured yet (see README): keep the demo behaviour.
        this._t = setTimeout(() => { this.setState({ phase: 'sent' }); focusEl(P + 'done'); }, 900);
        return;
      }
      const st = this.state || {};
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          name: ((st.first || '') + ' ' + (st.last || '')).trim(),
          email: st.email || '',
          subject: st.subject || '',
          message: st.message || '',
          _replyto: st.email || '',
          _subject: 'Madden’s Adventures: ' + (st.subject || 'new message from the website'),
          _template: 'table',
          _captcha: 'false'
        })
      }).then((r) => r.json().catch(() => ({})).then((j) => {
        if (!r.ok || j.success === false || j.success === 'false') throw new Error('send failed');
        this.setState({ phase: 'sent' }); focusEl(P + 'done');
      })).catch(() => { this.setState({ phase: 'form', failed: true }); });
    };
    const reset = () => {
      this.setState({ first: '', last: '', email: '', subject: '', message: '', tried: false, phase: 'form' });
      focusEl(P + 'first');
    };
    let liveText = '';
    if (phase === 'sending') liveText = 'Sending your message…';
    else if (phase === 'sent') liveText = 'Thanks! Your message is on its way.';
    else if (failed && !bad.length) liveText = 'Sorry, that didn’t send. Please try again, or say hi on Instagram @majorsquest.';
    else if (bad.length) liveText = 'Please check ' + (bad.length === 1 ? '1 field' : bad.length + ' fields') + ': ' + bad.map(k => names[k]).join(', ') + '.';
    return {
      navOpen, navClosed: !navOpen, navOpenStr: navOpen ? 'true' : 'false',
      menuLabel: navOpen ? 'Close menu' : 'Open menu',
      toggleNav: () => this.setState({ navOpen: !navOpen }),
      first: v.first, last: v.last, email: v.email, subject: v.subject, message: v.message,
      setFirst: set('first'), setLast: set('last'), setEmail: set('email'), setSubject: set('subject'), setMessage: set('message'),
      cls,
      err: shown,
      inv: { first: shown.first ? 'true' : 'false', email: shown.email ? 'true' : 'false', message: shown.message ? 'true' : 'false' },
      desc: { first: shown.first ? P + 'first-err' : undefined, email: shown.email ? P + 'email-err' : undefined, message: shown.message ? P + 'message-err' : undefined },
      hasErrors: bad.length > 0 || failed,
      liveText,
      liveClass: (bad.length > 0 || failed) ? 'live is-err open-anim' : 'live sr',
      showForm: phase !== 'sent',
      sent: phase === 'sent',
      sending: phase === 'sending',
      sendingStr: phase === 'sending' ? 'true' : 'false',
      idle: phase !== 'sending',
      send,
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); send(); },
      reset
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
