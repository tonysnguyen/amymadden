@media (hover: hover) {

}
@media (max-width: 899px) { .sh-nav, .sh-r > .sh-cta { display: none; } .sh-menu { display: inline-flex; } }
@media (min-width: 900px) { .sh-sheet, .sh-scrim { display: none; } }
@media (max-width: 560px) { .sh-links a { font-size: 26px; min-height: 54px; } }
@media (prefers-reduced-motion: no-preference) {
  .sh-sheet.is-open .sh-links a, .sh-sheet.is-open .sh-row { animation: shIn .42s cubic-bezier(.2,.8,.2,1) backwards; }
  .sh-sheet.is-open .sh-links a:nth-child(2) { animation-delay: .03s; }
  .sh-sheet.is-open .sh-links a:nth-child(3) { animation-delay: .06s; }
  .sh-sheet.is-open .sh-links a:nth-child(4) { animation-delay: .09s; }
  .sh-sheet.is-open .sh-links a:nth-child(5) { animation-delay: .12s; }
  .sh-sheet.is-open .sh-row { animation-delay: .15s; }
  @keyframes shIn { from { opacity: 0; translate: 0 -8px; } }
}
@media (prefers-reduced-motion: reduce) { .sh-sheet, .sh-bar, .sh-scrim { transition: none; } }

.sf { background: #173350; color: #C4D0DA; padding: 72px 0 36px; }
.sf-in { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.sf-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 32px; }
.sf .sh-logo { color: #FFFFFF; font-size: 22px; }
.sf-line { margin: 0; font: 300 15px/1.5 'Poppins', sans-serif; color: #C4D0DA; }
.sf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 48px; }
.sf-h { margin: 0 0 10px; font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #FFFFFF; }
.sf-grid a { display: block; padding: 6px 0; font: 400 14px/1.5 'Poppins', sans-serif; color: #C4D0DA; text-decoration: none; transition: color .2s ease; }
.sf-bot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; margin-top: 48px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); font: 400 13px/1.5 'Poppins', sans-serif; }
.sf-chalk { color: #F6C453; }
.sf-up { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; font-weight: 500; text-decoration: none; }
@media (hover: hover) { .sf-grid a:hover, .sf-up:hover { color: #F6C453; } }
@media (max-width: 760px) { .sf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .sf { padding: 56px 0 24px; }
  .sf-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 32px; }
  .sf-grid a { padding: 9px 0; }
  .sf-bot { margin-top: 32px; }
}

/* ===== page transitions ===== */
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .pg-in { animation: pgIn .55s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes pgIn { from { opacity: 0; translate: 0 10px; } }
  ::view-transition-old(root) { animation: vtOut .2s ease both; }
  ::view-transition-new(root) { animation: vtIn .36s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes vtOut { to { opacity: 0; } }
  @keyframes vtIn { from { opacity: 0; translate: 0 8px; } }
}
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
@media (hover: none) and (prefers-reduced-motion: no-preference) { .nx-card:active, .sh-cta:active, .sh-soc:active { transform: scale(.98); transition: transform .12s ease; } }

/* ===== up next hand-off ===== */
.nx { padding: clamp(88px, 9vw, 128px) 0; }
.nx-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 32px; padding: 20px 20px 20px clamp(24px, 4vw, 56px); border-radius: 28px; background: #FFFFFF; color: #173350; text-decoration: none; box-shadow: 0 1px 1px rgba(23,51,80,.04), 0 18px 40px -18px rgba(23,51,80,.28); transition: transform .42s cubic-bezier(.2,.8,.2,1), box-shadow .42s cubic-bezier(.2,.8,.2,1); }
.nx-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.nx-eb { display: inline-flex; align-items: center; gap: 10px; font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #3F5873; }
.nx-eb::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #F6C453; }
.nx-title { display: inline-flex; align-items: center; gap: 18px; font-family: 'Archivo', sans-serif; font-stretch: 100%; font-weight: 700; font-size: clamp(36px, 4.6vw, 56px); line-height: 1.02; letter-spacing: -0.03em; }
.nx-arrow { flex: none; width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #375CF0; color: #FFFFFF; transition: translate .35s cubic-bezier(.2,.8,.2,1); }
.nx-text { font: 300 16px/1.6 'Poppins', sans-serif; color: #3F5873; max-width: 440px; }
.nx-frame { display: block; overflow: hidden; border-radius: 20px; height: 280px; }
.nx-frame img { width: 100%; height: 100%; max-width: none; object-fit: cover; transition: scale .5s cubic-bezier(.2,.8,.2,1); }
.nx-dark { grid-template-columns: minmax(0, 1fr); background: #173350; color: #FFFFFF; padding: clamp(32px, 5vw, 64px); box-shadow: none; }
.nx-dark .nx-eb { color: #C4D0DA; }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .nx-card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(23,51,80,.06), 0 30px 60px -22px rgba(23,51,80,.42); }
  .nx-card:hover .nx-arrow { translate: 4px 0; }
  .nx-card:hover .nx-frame img { scale: 1.04; }
}
@media (max-width: 760px) {
  .nx { padding: 64px 0 80px; }
  .nx-card { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px; border-radius: 22px; }
  .nx-copy { padding: 14px 10px 10px; gap: 12px; }
  .nx-frame { order: -1; height: 200px; border-radius: 16px; }
  .nx-arrow { width: 44px; height: 44px; }
  .nx-dark { padding: 28px 22px; }
}

/* ===== viewer motion & focus ===== */
.viewer:focus { outline: none; }
.viewer:focus-visible { outline: 3px solid #F6C453; outline-offset: 3px; }
.pre { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .viewer.is-closing { animation: vwOut .19s cubic-bezier(.4,0,1,1) both; }
  @keyframes vwOut { to { opacity: 0; translate: 0 10px; } }
  .ph-n0 { animation: phN0 .38s cubic-bezier(.2,.8,.2,1) both; } .ph-n1 { animation: phN1 .38s cubic-bezier(.2,.8,.2,1) both; }
  .ph-p0 { animation: phP0 .38s cubic-bezier(.2,.8,.2,1) both; } .ph-p1 { animation: phP1 .38s cubic-bezier(.2,.8,.2,1) both; }
  .ph-j0 { animation: phJ0 .32s cubic-bezier(.2,.8,.2,1) both; } .ph-j1 { animation: phJ1 .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes phN0 { from { opacity: 0; translate: 32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phN1 { from { opacity: 0; translate: 32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phP0 { from { opacity: 0; translate: -32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phP1 { from { opacity: 0; translate: -32px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes phJ0 { from { opacity: 0; scale: .97; } to { opacity: 1; scale: 1; } }
  @keyframes phJ1 { from { opacity: 0; scale: .97; } to { opacity: 1; scale: 1; } }
  .wall-grid.ga0 .tile { animation: gA .42s cubic-bezier(.2,.8,.2,1) backwards; }
  .wall-grid.ga1 .tile { animation: gB .42s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes gA { from { opacity: 0; translate: 0 12px; } }
  @keyframes gB { from { opacity: 0; translate: 0 12px; } }
}

<body>
<div id="dc-root"></div>
<noscript><p style="font-family:sans-serif;padding:24px;max-width:640px">This site needs JavaScript turned on to show Amy’s chalk art and photos.</p></noscript>
<template id="dc-template"><div class="pg pg-d" style="background:#F8FAFB; font-family:'Poppins',sans-serif">
<header class="sh-hdr" id="top" onKeyDown="{{sh.key}}">

      <div class="sh-r">
        <a class="sh-ic" href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5v.01"></path></svg></a>
        <a class="sh-cta" href="contact.html">Say hello</a>
        <button class="sh-menu" type="button" aria-label="{{sh.label}}" aria-expanded="{{sh.exp}}" aria-controls="sh-sheet" onClick="{{sh.toggle}}"><span class="sh-bar b1" aria-hidden="true"></span><span class="sh-bar b2" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="sh-sheet {{sh.cls}}" id="sh-sheet">
      <div class="sh-sheet-in"><div class="sh-pad">
        <nav class="sh-links" aria-label="Menu"><a href="index.html"><span>Home</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="about.html"><span>About</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="chalk-art.html"><span>Chalk Art</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="moments.html" aria-current="page"><span>Moments</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a><a href="adventures.html"><span>Adventures</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a></nav>
        <div class="sh-row">
          <a class="sh-cta sh-cta-lg" href="contact.html">Say hello</a>
          <a class="sh-soc" href="https://www.instagram.com/majorsquest/" target="_blank" rel="noopener"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5v.01"></path></svg>Instagram</a>
          <a class="sh-soc" href="https://www.linkedin.com/in/amy-madden-b2183a4/" target="_blank" rel="noopener"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10.5V17M8 7.5v.01M12 17v-6.5M12 13.5a2.5 2.5 0 0 1 5 0V17"></path></svg>LinkedIn</a>
        </div>
      </div></div>
    </div>
  </header>
  <button class="sh-scrim {{sh.cls}}" type="button" tabindex="-1" aria-label="Close menu" onClick="{{sh.close}}"></button>
<main class="pg-in">
  <section class="m-open">
    <div class="wrap">
      <h1 class="eyebrow reveal">Moments</h1>
      <p class="display m-quote reveal">“It’s all the little moments that make life a <span class="nw"><span class="sq">big adventure<svg class="sq-line" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 10 C 22 3, 38 14, 58 8 S 92 3, 112 9 S 146 14, 166 7 S 190 5, 197 9" fill="none" stroke="#F6C453" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></span>.”</span></p>
      <div class="m-intro reveal">
        <p class="lead">Sharing all the little moments and memories that make life worth it. Pups, camping, friends, family and cars – just to name a few.</p>
        <p class="m-note"><span class="ast" aria-hidden="true">✳︎</span>(If you know who said this quote – let me know) ;)</p>
      </div>
    </div>
  </section>
  <section class="m-ch" aria-labelledby="ch-label">
    <div class="wrap">
      <div class="sec-head reveal"><h2 class="eyebrow" id="ch-label">Chapters</h2><p class="hint">Choose a chapter to open its photos.</p></div>
      <div class="ch-row">
        <button class="ch tile {{c.major.cls}}" data-card="major" style="order:1;" type="button" aria-expanded="{{c.major.exp}}" onClick="{{c.major.open}}">
          <span class="ch-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/moments/major/cover.webp" alt="Major, the rescue pup" style="object-position:center 30%"></span>
          <span class="ch-scrim" aria-hidden="true"></span>
          <span class="ch-dot" aria-hidden="true"></span>
          <span class="ch-text"><span class="ch-title">Major Love</span><span class="ch-pill">Woof!<span class="n">24 photos</span></span></span>
        </button>
        <button class="ch tile {{c.gear.cls}}" data-card="gear-head" style="order:3;" type="button" aria-expanded="{{c.gear.exp}}" onClick="{{c.gear.open}}">
          <span class="ch-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/moments/gear-head/cover.png" alt="The 1971 Datsun 240z" style="object-position:center"></span>
          <span class="ch-scrim" aria-hidden="true"></span>
          <span class="ch-dot" aria-hidden="true"></span>
          <span class="ch-text"><span class="ch-title">Gear Head</span><span class="ch-pill">Vroom<span class="n">33 photos</span></span></span>
        </button>
        <button class="ch tile {{c.camp.cls}}" data-card="camping-family-fun" style="order:5;" type="button" aria-expanded="{{c.camp.exp}}" onClick="{{c.camp.open}}">
          <span class="ch-media"><img loading="lazy" decoding="async" class="zoom" src="assets/img/moments/camping-family-fun/cover.webp" alt="Camping with family and friends" style="object-position:center"></span>
          <span class="ch-scrim" aria-hidden="true"></span>
          <span class="ch-dot" aria-hidden="true"></span>
          <span class="ch-text"><span class="ch-title">Camping, Family, Fun.</span><span class="ch-pill">Check it out<span class="n">56 photos</span></span></span>
        </button>
      <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
        <div class="vslot" style="order:{{vOrder}};"><section class="viewer open-anim {{vClosing}}" data-viewer="1" tabindex="-1" onKeyDown="{{onKey}}" id="moments-viewer" aria-label="{{v.title}} photos">
  <div class="v-top">
    <div><p class="v-eyebrow">{{v.eyebrow}}</p><h3 class="v-title">{{v.title}}</h3></div>
    <div class="v-tools">
      <span class="v-count" aria-live="polite">{{v.counter}}</span>
      <button class="v-close" type="button" aria-label="Close gallery" onClick="{{close}}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </div>
  <div class="v-body">
    <div>
      <div class="v-stage" onTouchStart="{{swStart}}" onTouchEnd="{{swEnd}}">
        <img class="v-img {{anim}}" src="{{v.src}}" alt="{{v.alt}}"><img class="pre" src="{{nextSrc}}" alt="" aria-hidden="true"><img class="pre" src="{{prevSrc}}" alt="" aria-hidden="true">
        <sc-if value="{{v.hasMany}}" hint-placeholder-val="{{ true }}">
          <button class="v-nav v-prev" type="button" aria-label="Previous photo" onClick="{{prev}}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="v-nav v-next" type="button" aria-label="Next photo" onClick="{{next}}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        </sc-if>
      </div>
      <div class="v-strip">
        <sc-for list="{{v.thumbs}}" as="t" hint-placeholder-count="6">
          <button class="v-thumb {{t.cls}}" type="button" aria-label="{{t.label}}" aria-current="{{t.current}}" onClick="{{t.go}}"><img loading="lazy" decoding="async" src="{{t.src}}" alt=""></button>
        </sc-for>
      </div>
      <div class="v-foot"><span>{{v.showing}}<span class="swipe-hint"> · Swipe to browse</span></span><a href="{{v.src}}" target="_blank" rel="noopener">Full resolution ↗</a></div>
    </div>
    <div class="v-det"><sc-if value="{{isMajor}}" hint-placeholder-val="{{ true }}">
        <p class="v-det-spec">24 photos</p>
        <p>The end of January 2020, Major came into our lives from the Third Chance Program at the Irvine Animal Rescue/Shelter. He was given up multiple times before finding his forever home with our family. He’s smart, loyal, well-behaved and our adventure companion. He loves hanging out with his pup friends at daycare. Can’t imagine our life without him.</p>
      </sc-if>
      <sc-if value="{{isGear}}" hint-placeholder-val="{{ false }}">
        <p class="v-det-spec">33 photos + a video</p>
        <p>Cars and motorcycles have always been part of my life. So many memories at Thanksgiving Car Shows in SF, Sears Point Raceway Drag Nights, Cars &amp; Coffee, Rigs &amp; Coffee, T-Hill and countless go-kart races (that I never won hehe). Not to mention some awesome cars that I have had the pleasure of owning and adventuring with over the years. Big fan of the Jeep XJs, AWD Wagons, Toyota 4Runners, Toyota Land Cruisers and the Datsun 240z.</p>
        <div class="v-rule"></div>
        <h4 class="v-det-h">1971 240z Datsun</h4>
        <p>A little restoration project most of my friends and family have helped out on at one time or another. She likes to test my patience sometimes, but is so beautiful.</p>
        <a class="v-link" href="https://www.youtube.com/watch?v=jnq4DB8Qpto" target="_blank" rel="noopener">Watch the 240z video ↗</a>
      </sc-if>
      <sc-if value="{{isCamp}}" hint-placeholder-val="{{ false }}">
        <p class="v-det-spec">56 photos</p>
        <blockquote><p class="v-q">“Love the life you live. Live the life you love.”</p><p class="v-by">— Bob Marley</p></blockquote>
        <div class="v-rule"></div>
        <blockquote><p class="v-q">“Family is not an important thing. It’s everything.”</p><p class="v-by">— Michael J. Fox</p></blockquote>
      </sc-if></div>
  </div>
</section></div>
      </sc-if>
      </div>
    </div>
  </section>
<section class="nx" aria-label="Up next">
    <div class="wrap">
      <a class="nx-card reveal" href="adventures.html">
        <span class="nx-copy">
          <span class="nx-eb">Up next</span>
          <span class="nx-title">Adventures<span class="nx-arrow" aria-hidden="true"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></span>
          <span class="nx-text">Photography of adventures taken both internationally and domestically in the US. Vietnam, CA, WA etc. Let’s explore!</span>
        </span>
        <span class="nx-frame"><img loading="lazy" decoding="async" src="assets/img/adventures/vietnam-2017/cover.webp" alt="Travel photo from Amy's first trip to Vietnam"></span>
      </a>
    </div>
  </section>
</main>
<footer class="sf">
    <div class="sf-in">
      <div class="sf-top">
        <a class="sh-logo" href="index.html">Madden's Adventures<span class="sh-dot" aria-hidden="true"></span></a>
        <p class="sf-line">Little moments, big adventures.</p>
